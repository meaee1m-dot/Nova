name: Update content (auto)

# Refresh the movie / series / anime / channel catalogs, the football fixtures
# and the btolat highlights straight from their sources on a schedule, then
# commit the refreshed JSON back to the repo. If your host (Render / Railway /
# Vercel / Netlify) auto-deploys from GitHub, the live site updates itself with
# zero manual work.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write             # needed to push the refreshed data

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh catalogs from the Oscar TV API
        run: node update-content.js

      - name: Refresh football fixtures + match details
        run: node update-matches.js --days 3
        continue-on-error: true

      - name: Refresh btolat highlights
        run: node update-btolat.js
        continue-on-error: true

      - name: Commit & push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/oscar_movies.json site/data/oscar_series.json site/data/oscar_anime.json site/data/oscar_channels.json site/data/oscar_home.json site/data/matches.json site/data/match_details.json site/data/btolat.json
          if git diff --cached --quiet; then
            echo "No content changes — nothing to commit."
          else
            git commit -m "chore(data): auto-refresh content $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

services:
  - type: web
    name: novatv
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The server ships a static Psiphon client (tools/psiphon-tunnel-core)
      # and starts it automatically, so it gets a residential exit IP and can
      # fetch the REAL watch servers even from a datacenter host like Render.
      # If you already run your own residential proxy, set OSCAR_PROXY below
      # (e.g. http://user:pass@host:port) and set OSCAR_NO_PSIPHON=1.
      - key: OSCAR_PROXY
        sync: false
      - key: OSCAR_NO_PSIPHON
        value: "0"
      # ---- auto-refresh cadence (in-process, no GitHub Actions needed) ----
      # Movies / series / anime / channels / home  ->  every 60 min (hourly).
      - key: CONTENT_REFRESH_MINUTES
        value: "60"
      # Fixtures / match details / btolat highlights  ->  every 2 min.
      - key: LIVE_REFRESH_MINUTES
        value: "2"
      # How long a live Oscar API response is cached in-process (seconds).
      - key: LIVE_CACHE_SECONDS
        value: "60"
      # (legacy) leave at 0 — the two vars above take over.
      - key: AUTO_REFRESH_HOURS
        value: "0"
      # Optional safety net: pull the freshest JSON snapshots from GitHub raw
      # (only helps if you also run the Actions workflow that commits them).
      - key: DATA_SYNC_URL
        value: "https://raw.githubusercontent.com/meaee1m-dot/Nova/main/site/data"
      - key: DATA_SYNC_MINUTES
        value: "5"
      # Optional: enables GET /api/refresh?token=...&scope=content|live|all so
      # an external cron (cron-job.org, UptimeRobot, ...) can trigger a refresh.
      - key: REFRESH_TOKEN
        sync: false
      # Optional: override the listening port (Render sets PORT automatically).
      - key: PORT
        value: "3000"
